name: Android CI

# 1. Triggers: When should this workflow run?
on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    # 2. Environment: Run on the latest Ubuntu runner
    runs-on: ubuntu-latest

    steps:
    # 3. Checkout: Pull your repository code into the runner
    - name: Checkout codebase
      uses: actions/checkout@v4

    # 4. Java Setup: Configure JDK 21 and enable Gradle caching
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    # 5. Permissions: Ensure the Gradle wrapper is executable
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 6. Lint & Test: Run static analysis and unit tests
    - name: Run Lint
      run: ./gradlew lintDebug

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    # 7. Build: Compile the debug APK
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 8. Artifacts: Upload the compiled APK so you can download it from GitHub
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/**/*.apk
